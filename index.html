<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Kitty Mood Machine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐱 Kitty Mood Machine</h1>
            <p>Adopt and display cute AI kitties!</p>
        </header>

        <div class="main-content">
            <div class="cat-display">
                <div class="cat-container">
                    <img id="catImage" src="cat-happy.png" alt="Cute cat" class="cat-image">
                </div>
            </div>

            <div class="controls">
                <div class="mood-selector">
                    <h3>Select a Kitty:</h3>
                    <div class="mood-buttons">
                        <button class="mood-btn active" data-mood="happy">😸 Happy</button>
                        <button class="mood-btn" data-mood="angry">😾 Grumpy</button>
                        <button class="mood-btn" data-mood="sleepy">😴 Sleepy</button>
                        <button class="mood-btn" data-mood="hungry">🍽️ Hungry</button>
                        <button class="mood-btn" data-mood="playful">🎾 Playful</button>
                        <button class="mood-btn" data-mood="curious">🔍 Curious</button>
                        <button class="mood-btn" data-mood="scared">😨 Scared</button>
                        <button class="mood-btn" data-mood="excited">🎉 Excited</button>
                        <button class="mood-btn" data-mood="loving">💖 Loving</button>
                        <button class="mood-btn" data-mood="mischievous">😈 Mischievous</button>
                    </div>
                </div>
            </div>
        </div>


        <div class="new-kitty-controls">
            <button id="newKittyBtn">💖 Adopt a New Kitty!</button>
            <button id="clearKittiesBtn" class="clear-btn" style="display: none;">🗑️ Clear Adopted Kitties</button>
        </div>

    </div>

    <script type="importmap">
    {
      "imports": {
        "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.module.mjs"
      }
    }
    </script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
